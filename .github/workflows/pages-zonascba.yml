name: Publicar ZONAS CBA web (iPhone)

on:
  push:
    branches: [ main ]
    paths:
      - 'ZonasCBA/**'
      - '.github/workflows/pages-zonascba.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-zonascba
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout gh-pages (o crearla la primera vez)
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages; then
            git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          else
            mkdir site && cd site && git init -q -b gh-pages && touch .nojekyll && git add .nojekyll
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Armar la web
        run: node src/ZonasCBA/web/build.js src/ZonasCBA/app/src/main/assets src/ZonasCBA/web /tmp/zonas

      - name: Copiar a gh-pages/zonas y subir si cambió
        run: |
          cd site
          rm -rf zonas && cp -r /tmp/zonas zonas
          git add -A .
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "ZONAS CBA web"
          git push origin gh-pages
